<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>g</title>

<style>
  body {
    margin: 0;
    background: #0f0f0f;
    color: white;
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
  }

  .box {
    width: 90%;
    max-width: 500px;
    text-align: center;
  }

  h1 {
    font-size: 70px;
    margin-bottom: 20px;
  }

  input {
    width: 100%;
    padding: 15px;
    border-radius: 30px;
    border: none;
    font-size: 18px;
    outline: none;
  }
</style>
</head>
<body>

<div class="box">
  <h1>g</h1>
  <input id="input" placeholder="Search or enter URL..." onkeydown="if(event.key==='Enter') go()">
</div>

<script>
function go() {
  let q = document.getElementById("input").value.trim();
  if (!q) return;

  let url;

  if (q.startsWith("http://") || q.startsWith("https://")) {
    url = q;
  } else if (q.includes(".")) {
    url = "https://" + q;
  } else {
    url = "https://www.google.com/search?q=" + encodeURIComponent(q);
  }

  // Ultraviolet encoding
  let encoded = __uv$config.encodeUrl(url);
  location.href = "/uv/service/" + encoded;
}
</script>

<script src="/uv/uv.bundle.js"></script>
<script src="/uv/uv.config.js"></script>

</body>
</html>
